      <text x="344" y="216" text-anchor="middle" class="node-label">Memory</text>
      <text x="344" y="136" text-anchor="middle" class="node-id">03</text>
    </g>
    
    <g>
      <circle cx="246" cy="266" r="31" fill="#8db5ff" opacity="0.14"/>
      <circle cx="246" cy="266" r="10" fill="#8db5ff"/>
      <circle cx="246" cy="266" r="4" fill="#eef4ff"/>
      <text x="246" y="312" text-anchor="middle" class="node-label">Evaluation</text>
      <text x="246" y="232" text-anchor="middle" class="node-id">04</text>
    </g>
    
    <g>
      <circle cx="141" cy="308" r="31" fill="#39d8ff" opacity="0.14"/>
      <circle cx="141" cy="308" r="10" fill="#39d8ff"/>
      <circle cx="141" cy="308" r="4" fill="#dff8ff"/>
      <text x="141" y="354" text-anchor="middle" class="node-label">Protocols</text>
      <text x="141" y="274" text-anchor="middle" class="node-id">05</text>
    </g>
    
    <g>
      <circle cx="348" cy="292" r="31" fill="#c6a7ff" opacity="0.14"/>
      <circle cx="348" cy="292" r="10" fill="#c6a7ff"/>
      <circle cx="348" cy="292" r="4" fill="#f5f0ff"/>
      <text x="348" y="338" text-anchor="middle" class="node-label">Product</text>
