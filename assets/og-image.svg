      <text x="244" y="178" text-anchor="middle" class="node-label">Tools</text>
      <text x="244" y="98" text-anchor="middle" class="node-id">02</text>
    </g>
    
    <g>
      <circle cx="344" cy="170" r="31" fill="#c6a7ff" opacity="0.14"/>
      <circle cx="344" cy="170" r="10" fill="#c6a7ff"/>
